; Настройки камеры для рендеринга

; --- Настройки для ВНЕШНЕЙ стороны ---
[Camera_out]
; Фокусное расстояние объектива (в мм).
; Больше значение = "приближение", меньше = "отдаление".
lens = 72

; Базовое расстояние от камеры до двери (в метрах).
; Это значение будет автоматически увеличено, если наличники (pff, zff) шире стандартных 85мм.
base_distance = 5.0

; Смещение положения камеры относительно центра двери.
; Значения являются множителями от ширины/высоты двери.
; 0.0 = точно по центру.
location_x_factor = -1.0
location_z_factor = 0.0

; Смещение точки, на которую смотрит камера, вверх.
; 0.07 = смещение на 7% от высоты двери вверх.
aim_up_factor = -0.02

; --- Настройки для ВНУТРЕННЕЙ стороны ---
[Camera_in]
lens = 72
; Фиксированное расстояние для внутренней стороны.
distance = 5.0
location_x_factor = 0.8
location_z_factor = 0.0
aim_up_factor = 0.07

